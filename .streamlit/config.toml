[theme]
base = "light"
primaryColor = "#1d4ed8"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"
font = "sans serif"

[server]
maxUploadSize = 10                 # MB per file
enableXsrfProtection = true        # blocks other websites from submitting forms to PlainSpeak
enableCORS = true

[browser]
gatherUsageStats = false           # don't send usage statistics to Streamlit

[client]
showErrorDetails = false           # never show code or stack traces to visitors
toolbarMode = "viewer"             # hide developer menu items from visitors
