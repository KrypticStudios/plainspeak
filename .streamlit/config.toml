[theme]
base = "light"
primaryColor = "#B84E25"
backgroundColor = "#F1ECE2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F3B2D"
borderColor = "#D6CCB8"
linkColor = "#9E3F1A"
font = "DM Sans:https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&display=swap"
baseRadius = "large"
buttonRadius = "full"

[server]
maxUploadSize = 10                 # MB per file
enableXsrfProtection = true        # blocks other websites from submitting forms to PlainSpeak
enableCORS = true

[browser]
gatherUsageStats = false           # don't send usage statistics to Streamlit

[client]
showErrorDetails = false           # never show code or stack traces to visitors
toolbarMode = "viewer"             # hide developer menu items from visitors
